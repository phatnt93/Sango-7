String = 66164,Tao Thao tuong yeu Luu Bi, den bach mon lau mot dam.
String = 66165,Ha ha! Nguoi doi thuong noi: "Nguoi co Lu Bo, ngua co Xich Tho". Huyen Duc hay xem, ke dang bi troi duoi the kia chang phai "Lu Bo trong loai nguoi" sao?
