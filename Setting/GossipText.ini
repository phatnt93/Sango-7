String = 66048,Nghe noi tien sinh an cu canh tac, tu vi minh voi Quan Trong, Nhac Nghi la bac co tai te the. Nay pho ta Huyen Duc cong, le ra phai bay dieu ke cuu dan khoi canh nuoc lua. Sao lai so the Tao tac, muon dua vao Giang Dong ta che cho?
String = 66049,Tien sinh noi la lien minh chong Tao, nhung theo ta thay, thuc chat chi vi so quan Tao qua manh nen den cau cuu Giang Dong. Vay ma con noi khong so, dung la noi khoac de lua nguoi!
String = 66050,Hmph! Khong Minh muon noi guong cai luoi cua Truong Nghi, To Tan de du thuyet Dong Ngo sao?
String = 66051,Nha Han truyen den nay khi so da tan. Tao cong hien nam hai phan ba thien ha, nhan tam deu quy phuc. Luu Huyen Duc khong biet thoi the ma con co tranh, chang khac nao lay trung chong da, sao co the khong bai?
String = 66052,Tao Thao tuy muon Thien Tu de lenh chu hau, nhung van la hau due cua Tuong quoc. Luu Huyen Duc tuy tu xung dong du Trung Son Tinh Vuong, song khong co bang chung, truoc mat chi la ke dan chieu ban giay, sao du suc doi dau Tao Thao?
String = 66053,Loi Khong Minh deu la cuong tu doat ly, chang phai chinh luan, khong can noi them. Xin hoi Khong Minh nghien cuu kinh dien nao?
String = 66054,Tien sinh ua noi dai ngon, chua chac co thuc hoc, e chi lam tro cuoi cho gioi nho si.
String = 66055,Thuong nghe cac ha tai cao, co the chong lai tram van quan Tao. Tien sinh pho ta Luu Huyen Duc giao chien voi Tao Thao, han hieu ro thuc hu quan dich. Xin duoc chi giao.
String = 66056,trinh nhu quan loi, Luu Huyen duc gi khong hang Thao?
String = 66057,Hmph! Huyen Duc la anh hung, biet giu nghia khong khuat. Chang le Ton ta la ke tham sinh uy tu, thay dich manh la de dang dau hang sao? Khong Minh khinh ta qua lam!
String = 66058,Quan ta chong Tao tac, giap tru khong du, thanh luy chua vung, quan chua luyen ky, luong khong du dung, vay ma Ha Hau Don, Tao Nhan van khong the lay chuyen duoc ta. Khong Minh ta cho rang tai dung binh cua Quan Trong, Nhac Nghi cung chua chac hon the. It khong dich nhieu, thang bai la chuyen thuong. Co ke chi biet ngoi ban thao thao bat tuyet, den luc ung bien thi tram viec khong xong mot, moi that la tro cuoi thien ha!
String = 66059,Huyen Duc cong chi voi mot doi quan nhan nghia nho be ma van dam chong tram van quan hung bao cua Tao tac. Nay Giang Dong binh tinh luong du, vay ma cac nguoi lai muon chu minh quy goi hang giac, bat chap thien ha che cuoi. Nhu vay du biet chu ta Huyen Duc cong moi that su khong so Tao tac!
String = 66060,#b03# xem To Tan, Truong Nghi chi la bien si, nhung hai nguoi ay deu la hao kiet. To Tan deo an tuong sau nuoc, Truong Nghi hai lan lam Tuong nuoc Tan, deu co muu kinh bang te the, dau phai hang so manh hiep yeu, thay dao kiem la lui. Cac nguoi chi nghe loi hu tru cua Tao Thao da so hai muon hang, con dam che cuoi To Tan, Truong Nghi sao?
String = 66061,Day la loi vo phu vo quan! Nguoi song giua troi dat phai lay trung hieu lam goc. Da la than nha Han, thay ke bat than phai the cung tru diet. Tao Thao an loc nha Han ma khong bao dap, trai lai mang long soan nghich, thien ha deu cang phan. Nay ong lai noi thien menh thuoc ve han, qua la ke vo phu vo quan! Khong dang de ban tiep, xin dung noi nua!
String = 66062,Tao Thao la hau due Tao Tuong quoc, doi doi la than nha Han; nay lai chuyen quyen ngang nguoc, that la loan than nha Han, cung la nghich tu nha Tao. Huyen Duc cong duong duong dong du de that, chinh Hoang De hien nay da doi gia pha ma ban tuoc, sao bao khong the tra xet? Cao To xua chi la dinh truong ma cuoi cung lay duoc thien ha; dan chieu ban giay thi co gi dang nhuc? Cai nhin tre con cua ong khong dang cung bac cao si luan dam!
String = 66063,Chi biet tam chuong trich cu la hang hu nho, sao co the hung quoc lap nghiep? Nhu Y Doan, Khuong Tu Nha, Truong Luong, Tran Binh deu co tai kinh bang te the, ai biet ca doi ho nghien cuu kinh nao? Le nao cung nhu thu sinh chap but muc, chi biet chuong chuong cau cau, dua chu mua muc hay sao?
String = 66064,Nho si co quan tu va tieu nhan. Nho quan tu trung quan ai quoc, mong lam loi cho duong thoi va luu danh hau the. Nho tieu nhan chi cham chuot van tu, gioi but muc; du viet nghin loi ma trong long khong mot ke. Nhu Duong Hung noi danh van chuong, lai khom minh tho nghich tac Vuong Mang, cuoi cung nhay gac ma chet. Du moi ngay viet van loi thi co ich gi!
String = 66065,Duoi truong Tao Thao, muu si da tri nhieu ke, tuong linh thien chien nhieu nhu ca qua song; binh nhieu luong du, quan cu xe ngua day du. Xem vay, Tao Thao khong nhom ngo Giang Dong thi con muon lay dau? Mong tuong quan luong suc ma tinh. Neu Giang Dong khong du suc chong, chi bang som cat quan he; neu khong the, sao khong nghe cac muu si, cu dut khoat cuu dau xung than?
String = 66066,Huyen Duc cong la dong du vuong that, anh tai cai the, duoc muon nguoi nguong mo. Neu dai su khong thanh thi chi co chet giu tiet, sao co the khom minh duoi nguoi?
String = 66067,Luong noi loi mao pham, xin tuong quan thu toi. Nay trong thien ha co the chong Tao Thao chi co Huyen Duc cong va tuong quan. Quan Tao vi chinh chien xa da met moi, chinh la manh no da den cuoi tam. Neu tuong quan that long dong suc voi Du Chau, nhat dinh pha duoc quan Tao. Tao quan bai, the chan vac ba chan se thanh. Co hoi thanh bai nam o hom nay, mong tuong quan suy xet ky.
