String = 66120,Nguoi nay khong phai Don Phuc. Thu nho thich hoc kiem, tung giet nguoi bao thu cho ban, sau duoc dong ban cuu khoi lao, ben doi ho ten tron di, tim danh su hoc dao. Han chinh la Tu Thu dat Dinh Xuyen, tu Nguyen Truc; Don Phuc chi la gia danh.
