String = 65268,Van Vien la anh hung hao kiet duong the, tinh voi Van Truong nhu huynh de. Sao khong bo toi theo sang, giup Van Truong mot tay?
String = 65269,Tinh huynh de, Van Vien sao dam quen. Nhung bat dac di moi nguoi phung su mot chu... Noi them nua lai khong giong tac phong Quan huynh. Quyet mot tran thang bai di!
String = 65270,Tao Nhan chiu chet!!
