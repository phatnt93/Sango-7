String = 66040,Theo ta thay, hien nay the luc Tao Thao qua manh, quan ta e kho chong do. Chi bang lien ket voi Ton Quyen Dong Ngo de ho tro lan nhau. De Ton va Tao giang co, ta o giua thu loi, co gi khong tot?
