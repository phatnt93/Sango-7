String = 65272,Nghe noi Tu Hoang vo cong cao cuong, noi danh giua cac chu hau trong quan. Hom nay Quan mo dac biet den linh giao, xin tiep chieu!
String = 65273,den duoc tot! ta se lay nguoi cua mau den co quan ky!
String = 65274,Dang ghet! Tai sao lai la dai ca chu?! Khon kiep! Tran nay Lao Truong ta sao danh noi day!!
String = 65275,Trung va nghia kho toan ven. Tam de, de cu buong tay ma chien! Tran nay du ket qua ra sao, nguoi va ta van la huynh de tot.
