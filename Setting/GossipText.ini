String = 65278,Tu lau da nghe noi Thuong Son Trieu Tu Long co ban linh lon, hom nay de Lao Truong ta xem thu!
String = 65279,Neu luan suc manh, Tu Long kho thang Duc Duc, nhung chien truong dau chi dua vao man luc!
