String = 65409,Nghe noi Manh Duc cong vo co the tung hoanh chem giet, van co the hanh quan bay tran! Cong Can hom nay xin linh giao!
String = 65410,Nghe noi Thai Su Tu gap viec nghia la lam, la dai tuong duoc cac chu hau tranh nhau cau hien. Tao mo dung nguoi chi xem tai, khong luan xuat than. Tuong quan sao khong theo Tao mo, lap mot phen cong nghiep trong loan the?
String = 65411,Tao cong cu quan tha ngua qua den, Thai Su Tu hau day!
String = 65412,Cam Ninh tuong quan tung la thu linh Cam Pham tac noi danh, tieng truyen ngu ho tu hai. Anh hung can chon minh chu ma phung su, tuong quan sao khong doi sang theo Tao mo, lap mot phen su nghiep khac?
String = 65413,Ke kiem song tren song nuoc, ai ma khong biet danh Cam Hung Ba Cam Pham! Hom nay de ta can xem Tao Manh Duc nguoi co bao nhieu can luong!
