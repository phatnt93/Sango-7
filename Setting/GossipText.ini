String = 65354,Tu long voi ta ngua Manh khoi, hom nay se o nay mot phan cao duoi di!
String = 65355,Co the danh mot tran voi Manh Khoi that sung suong. Hom nay du thang bai song chet, Tu Long khong oanh trach!
String = 65356,Ma Manh Khoi ta doi doi danh mon, ke tho dan son da sao co tu cach giao chien ngang hang voi ta!
String = 65357,Hmph! Ma Manh Khoi y vao gia the ma kieu, ban linh that su ra sao? Tran nay se ro!
String = 65358,Tao tac! Hom nay ta se thay trieu dinh tru nguoi, ten loan than tac tu!
String = 65359,Hay lam Cam Ma Sieu! Tiec thay van khong phai doi thu cua Tao Manh Duc ta!
String = 65360,Nguoi la Hua Chu noi danh Ho Si? Hom nay de ta thu xem nguoi co phai chi la hu danh khong!
String = 65361,Nghe noi nguoi co danh Tay Luong Chi Ho, Ho Si ta hom nay se dau voi nguoi mot phen!
String = 65362,to gan Dien Vi! toc toc xuong ngua chiu troi!
String = 65363,Tay Luong tieu boi, dam o ta Dien Vi mat truoc tha tu!
String = 65364,Tieu nhi Tao Nhan, hom nay de nguoi thay uy phong Ma gia Tay Luong!
String = 65365,Ten nha que Tay Luong, neu khong nho gia the che cho, hom nay sao duoc dieu vo duong oai?
String = 65366,Chi dua vao Truong Cap nguoi ma cung dam can dai quan ta! Hom nay ta nhat dinh khien toan quan nguoi bi diet!
String = 65367,Ma Manh Khoi chi la mot ke tho mang Tay Luong, Truong Cap ta khong de vao mat!
String = 65368,Phu than dai nhan, xin ngai lui binh! Hai nhi khong muon lam dich voi ngai...
String = 65369,Cha con tuong tan la chuyen thuong trong loan the. Da moi nguoi phung su mot chu, con ta... thang bai hom nay cu de thien menh quyet dinh!
String = 65370,Nghe cho ky! Da moi nguoi phung su mot chu, hom nay tuyet khong duoc luu tinh! Ma Dai hiende!
String = 65371,Huynh truong! Tran hom nay bat dac di moi phai danh. Du song hay chet, chung ta cung khong duoc lam ho then khi khai nam nhi Ma gia!
String = 65372,Khong ngo huynh de nguoi va ta lai roi vao ket cuc cot nhuc tuong tan...
String = 65373,chien truong tren khong dam tan tinh, qua het toan suc, sinh chet au troi!
