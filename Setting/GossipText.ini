String = 65332,Hom nay ta se xem dieu phap ky muu cua Gia Cat Luong nguoi co chan noi cuong cung khoai dao cua ta khong!
String = 65333,Khong Minh chi la son da tho dan, lai phien lao tuong quan tu minh xuat tran, toi loi! Toi loi!
