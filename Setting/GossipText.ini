String = 65335,nam lao de shuai se nen lui an thanh tien, gi kho ra tran lao luy!
String = 65336,Dam doi dau Hoang Trung ta, khong so con mat kia cung bi ban mu sao?
String = 65337,Lao gia, thay Ha Hau Don ta ma con khong kep duoi bo chay?
String = 65338,Ha Hau Uyen chiu chet!
String = 65339,lao gia se den quan ta lon lao duong lao di!
String = 65340,Nghe noi Truong Lieu vo nghe vo duc deu tot, hom nay de Lao Hoang Trung hoi nguoi mot phen!
String = 65341,lao tuong quan duc cao mong trong, thu Truong Lieu muu pham roi!
String = 65342,lao phu som se muon va ho xich Hua Chu giao tay roi!
String = 65343,Ta xua nay kinh gia trong truong, nhuong nguoi mot tay! Keo nguoi khac bao ta bat nat lao gia, ha ha ha!
String = 65344,ta Hoang Trung tong hoanh sa tran cua khi hau, nguoi van o an nai ne!
String = 65345,Tren chien truong so la vo cong, khong phai tuoi tac! Lao tuong quan nen ve nha duong lao di!
String = 65346,Tao Nhan nho con, biet thien nam au, cung dam tren chien truong diu lien ma?
String = 65347,lao that phu! chan ta Tao Nhan cua duong! chet khong tang than!
String = 65348,Dong tac! Xem Hoang Trung ta bam nguoi thanh tuong thit, de chuoc toi hai nuoc hai dan!
String = 65349,lao that phu, ta nhat dinh phai nguoi nhan nam ngua phan thi cua hanh!!
String = 65350,Ma Sieu ta uy chan Tay Luong, nguoi Khuong ngoai ai cung phuc! Luu Huyen Duc, con khong mau bo tay chiu troi!
String = 65351,Hay lam Ma Manh Khoi! Hay lam anh hung xuat thieu nien Cam Ma Sieu! Luu Huyen Duc xin linh giao cao chieu.
String = 65352,Danh thang nguoi gia khong phai phong pham vo gia, lao tuong quan nen lui di!
