String = 5210,    Nam 184. Nam dau Trung Binh thoi Dong Han. Linh De bat tai, trieu cuong suy yeu, dan chung lam than. Thai Binh dao nhan Truong Giac ho vang: "Thuong thien da chet, Hoang thien se lap", dan quan Hoang Can khoi nghia. Dai tuong quan Ha Tien phung chi chinh phat, dan Luu Bi, Tao Thao, Vien Thieu cung cac danh tuong doi khang. Quan phiet va hao kiet cac noi cung noi day tranh doat giang son, thien ha dai loan, mo man thoi loan Tam Quoc quan hung tranh ba..........
String = 5211,    Nam 189. Trung Binh nam thu sau. Linh De qua doi, Thieu De ke vi. Dai tuong quan Ha Tien bi mat trieu Tinh Chau muc Dong Trac dem quan vao kinh de tru hoan quan. Ha Tien that bai va bi hoan quan giet, Vien Thieu nhan co diet sach hoan quan. Dong Trac nhan co chiem Lac Duong, lap Hien De, phe Thieu De, len chuc Tuong Quoc va thao tung trieu dinh. Hao kiet cac noi ket thanh lien minh, cung khoi binh thao phat Dong Trac, mo ra cuoc long tranh ho dau duoi danh nghia can vuong diet tac.
String = 5212,    Nam 194. Hung Binh nam dau. Tu do Vuong Doan sai con nuoi Dieu Thuyen dung my nhan ke ly gian, khien Lu Bo giet Dong Trac. Quan doi cac noi mat danh nghia xuat binh, lien minh tan ra chi sau mot dem. Cuoc tranh chap giua cac chau muc ngay cang ac liet, noi chien toan Trung Nguyen bung no. Quyen muu chinh tri va xung dot vu luc giua cac quan phiet dat den muc chua tung co.
String = 5213,    Nam 199. Kien An nam thu tu. Vien Thieu diet Cong Ton Toan, chiem U, Ky, Thanh va Tinh Chau o phuong Bac. Tieu Ba Vuong Ton Sach binh dinh Giang Dong. Luu Bi tu lap tai Tu Chau, sau theo Luu Bieu. Tao Thao phu Hien De lay chinh thong, diet Vien Thuat, chem Lu Bo, nam Trung Nguyen. Nam sau Tao Thao dung tinh binh luong tuong dai pha Vien Thieu tai Quan Do, su goi la "Tran Quan Do". Tu do thien ha dan hinh thanh the tam phan.
String = 5214,    Nam 208. Kien An nam thu muoi ba. Luu Bi ba lan den leu tranh moi duoc Ngoa Long Gia Cat Khong Minh, dong thoi thu nap Kinh Chau. Ton Quyen ke nghiep anh la Ton Sach, lam chu Giang Dong. Luu Bi lien hop Ton Quyen bac tien, dai pha Tao Thao tai Xich Bich. Tu day the thien ha dan chia ba.
String = 5215,    Nam 219. Kien An nam thu hai muoi bon. Luu Bi vao Thuc, chiem Han Trung va tu xung Han Trung Vuong. Ton Quyen tien chiem Kinh Chau. Nam sau Tao Thao mat, con Tao Phi ke vi xung de, la Nguy Van De, nha Han diet. Nam ke tiep Luu Bi xung de, la Thuc Han Chieu Liet De. Ton Quyen sau doi nien hieu Hoang Long va xung Dong Ngo Dai De. The chan vac Thuc Han, Tao Nguy, Dong Ngo tu do duoc xac lap.
String = 5216,    Nam 263. Khuong Duy, hoc tro cua Gia Cat Luong, pho ta Thuc Hau Chu Luu Thien chong lai dai tuong Tao Nguy Tu Ma Y. The cuc khong the cuu van, Thuc Han diet, Luu Thien hang Nguy. Dong Ngo don doc, khong con suc doi khang voi Nguy. The tam phan dan tien den thong nhat...........
String = 5217,    Nam ???. Khong cam long de thien ha chi do nam nhan lam chu, cac nu tuong Tam Quoc dong loat khoi nghia. Nhat thoi giang son van dam deu nam trong tay nu nhi, cuoc chien Quan Phung bat dau.........
String = 5218,    Nam ???. Yeu tinh luot qua bau troi, thien tuong bien di. Hao kiet Tam Quoc tu nhieu thoi dai vuot thoi khong hoi tu, moi nguoi dung van thao vo luoc tranh ngoi ba chu. Hay xem quan hung Tam Quoc tam mau ngan dam, viet nen truyen ky moi tren dat Than Chau.........
String = 5219,    Nam ???. Thien tuong bien di, Ke Do va La Hau cung xuat hien. Ba Vuong Hang Vu nuoi mong doat giang son nha Han tu lau, tu Luyen Nguc tro lai nhan gian, dan theo nhieu luyen nguc tuong va yeu thu hoanh hanh. Cung luc, Cao To Luu Bang dan Thong Thien De Quan ha pham bao ve giang son Dai Han. The cuc thien ha hon don, cac anh hung tam gac tu thu, dong long doi pho thu thach dot ngot nay.........


