String = 24500,Mo ta tran hinh
String = 24501,Phuong Hinh Tran thuoc nhat co ban tran hinh, hang truoc bo tri can chien Quan doi, hang sau bo tri tam xa Quan doi la nhat dien hinh binh luc cach bo tri. Phuong Hinh Tran thuoc tinh thuong thuoc Thuan Tran, doi voi khang thuoc tinh Kiem tran hinh khi se rat co loi; nhung doi dau thuoc tinh Chuy tran hinh thi vo cung bat loi.
String = 24502,Tuong Ung Tran co the dong thoi tang quan ta Binh linh cong kich va Toc di chuyen, la kha manh cao cap tran hinh, co nhanh xung tan tran the quan dich cong hieu. Tuong Ung Tran ban than la thuoc tinh Kiem, doi dau Chuy Tran se rat co loi, nhung doi voi Thuan Tran thi bat loi.\nBinh linh cong kich tang\nToc chay binh linh tang
String = 24503,Thien Dia Tran la dong thoi tang quan ta Binh linh phong thu, cong kich, Toc di chuyen cao cap Tran hinh, gan nhu phu hop bat ky chien thuat. Thien Dia Tran dong thoi co cuc thuoc tinh, ngoai doi voi khong thuoc tinh tran the bat loi ngoai ra, doi dau nhiem ha tran hinh do huu ap dao uu the.\nBinh linh phong thu tang\nBinh linh cong kich tang\nToc binh linh tang
String = 24504,Nhan Hinh Tran la co the dong thoi tang Binh linh phong thu, Toc di chuyen cao cap Tran hinh. Hai ben hai canh quan co bao vay giap kich va tren duoi keo dai tinh co dong, tai dot nhap nhanh tran doanh quan dich sau, co the ngay lap tuc tao ra bao vay hieu qua. Nhan Hanh Tran thuoc Kiem Tran, doi dau Chuy Tran se rat co loi, nhung doi voi Thuan Tran thi bat loi. Can phat huy Nhan Hinh Tran bao vay, it nhat can co the tao thanh bon Vo tuong tro len Quan doi.\nBinh linh phong thu tang\nToc binh linh tang
String = 24505,Tien Thi Tran la chu trong tan cong va Toc tran hinh, phu hop ket hop Toc di chuyen man can chien Binh chung, dung lai dot kich khong gioi can chien tam xa Quan doi khi, hon huu bat ngo hieu qua dac biet. Tien Thi Tran thuoc Chuy Tran, doi voi Thuan Tran rat co loi, nhung kho ung pho Kiem Tran.\nToc binh linh tang\nBinh linh cong kich tang
String = 24506,Cau Hinh Tran la chu trong tan cong tran hinh, thanh co giac the xung phong trang thai, co the tang quan ta Binh linh cong kich. Cau Hinh Tran la Chuy Tran thuoc tinh, doi voi tai Thuan Tran rat manh, nhung doi voi Kiem Tran bat loi.\nBinh linh cong kich tang
String = 24507,Chuy Hinh Tran la co the dong thoi tang quan ta Binh linh cong kich, Toc di chuyen cao cap Tran hinh, chu can dac sac tai tai binh luc tap trung tai trung tam cot doc, tai vuot qua quan dich tien phong tuyen phong thu khi hieu qua dang kinh ngac. Co the thuyet la Chuy Tran trung cong kich nhat cuong tran hinh, khong gi khong pha duoc, chi la gap Kiem Tran khi tuu so voi kho phat huy uy luc.\nBinh linh cong kich tang\nToc binh linh tang
String = 24508,Vien Hinh Tran la chu trong phong thu tran hinh, cac Quan doi lien ket voi nhau, co the khien Binh linh phong thu tang. Vien Hinh Tran co the thuyet la phong thu nhat cao Thuan Tran, va Kiem Tran khi doi tran co the thuyet rat co loi, nhung gap Chuy Tran tuu rat nguy hiem.\nBinh linh phong thu tang
String = 24509,Thuy Kinh Tran giau the cong trong vo hinh, co the hoa giai tat ca tran hinh tan cong. Dac biet la doi dau thuoc tinh Cuc tran hinh hon huu vo tan gay sat thuong luc. Thuy Kinh Tran thuoc Vo Hinh Tran, co the dong thoi tang Binh linh cac nang luc, la cao cap nhat phong thu tran hinh.\nBinh linh cong kich tang\nToc binh linh tang\nBinh linh phong thu tang
