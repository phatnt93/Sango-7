String = 23501,Mot tay cam kiem nhanh dam toi tao ra tan anh tan cong, co the huu hieu gay sat thuong quan dich phia truoc.
String = 23502,Khi quan kiem than, du doi hoanh huong chem, pham vi khong dai, nhung gay sat thuong luc cuc cuong.
String = 23503,Cam kiem kich hoat sieu cao toc lien tuc tram kich, dung phan phi chan khong kiem khi tiem diet truoc mat dich.
String = 23504,Tap toan than khi luc noi len tuyen phong tan cong quan dich, uy luc thien de, nhung gay sat thuong pham vi cuc dai.
String = 23505,Phong ra Me Hon Doc Yen, khong che xung quanh binh dich y thuc, khien no dao ngu tro quan ta mot tay tro luc.
String = 23506,Huy phien phong ra hua da truy tich quang khi, co the tinh chuan chinh xac xung quanh quan dich.
String = 23507,Dung Dai dao huong sau manh tao, tuy chi cham doi voi phia sau dich tan cong, nhung doi voi chu tuong sat thuong thinh thoang se huu than lai but.
String = 23508,Dung Dai dao khieu khoi dich, lai huong truoc manh trich, dung thuan gian bao liet huyet vu tao ra cuc dai gay sat thuong luc.
String = 23509,Song thu tri vu khi huong truoc manh phach, gay khong lo bao phat luong khi, gay sat thuong luc vo cung dang kinh ngac.
String = 23510,Hai tay cam thuong trieu thuong nhanh tuyen chuyen, doi voi xung quanh quan dich tao ra manh hoi tuyen tan cong.
String = 23511,Dung Truong thuong manh nhien kich dia, tao ra dai pham vi luc phuong huong ba dong tan cong.
String = 23512,Tri thuong cao toc tuyen chuyen, kich xa khi kinh nhu khuynh bon dai vu thong thuong, tap kich quan dich xung quanh.
String = 23513,Tap tu sat khi, huong phia truoc ban ra manh phi tien, sieu truong cu ly duong thang tan cong la chieu nay toi da dac sac.
String = 23514,Dung khi hoa tien, ban ra mot xich hong duc hinh quang khi, tap sat doc duong nhieu quan dich.
String = 23515,Ban ra dien quang nhat thiem ban than tien, dung loi kich uy tan cong duong thang thuong nhieu quan dich.
String = 23516,Tap toan than sat khi dai hat nhat thanh tao ra tan cong song chan dong, la huong ngoai khoach tan dai pham vi manh Tuyet ky.
String = 23517,Vo tuong roi vao cuong bao trang thai, tri vu khi hai ben loan tram, hao hung manh Tuyet ky.
String = 23518,Vo tuong the noi dang cao sat khi, thang hoa la thuc the xung kich dan kich xa va xuat, nhan ba cap quan dich khong chet cung bi thuong.
String = 23519,Vo tuong tan phat sat khi gay khong lo song xung kich, tan cong pham vi cuc quang, uy luc vien sieu qua thong thuong Tuyet ky.
String = 23520,Toi thuong Tuyet ky, Vo tuong tinh khi than hop va la nhat, cuon trao chan khi nhu thao thien cu lang huy diet quan dich xung quanh.
String = 23521,Tuong truyen chi co vu cong thong than tai co the lanh ngo truyen thuyet Tuyet ky, sac liet vo cung sat khi song xung kich, tuong quet sach tren duong di toan bo quan dich.
