String = 40000,1. Xung tran doi quyet la che do hai vo tuong truc tiep so tai kha nang hanh quan va bo tran. Nguoi choi su dung diem bo tri Xung tran cua vo tuong de dat don vi Xung tran, bay phap thuat va cong trinh phong thu, xay dung va bao ve tran dia cua minh, dong thoi pha vo tran dia doi phuong.\n\n2. Ket qua Xung tran duoc quyet dinh boi diem Xung tran va sinh cua hai ben. Khi don vi Xung tran vuot qua thanh cong tran dia doi phuong, don vi se nhan diem dua tren suc manh cua no, dong thoi gay sat thuong cho vo tuong dich va roi chien truong. Don vi cang manh thi khi pha tran dich cang ghi nhieu diem va gay nhieu sat thuong.\n\n3. Suc manh don vi Xung tran phu thuoc vao diem bo tri Xung tran cua vo tuong. Don vi cang manh can cang nhieu diem bo tri; khi vuot qua tran dia cung nhan diem cao hon.\n\n4. Moi don vi Xung tran co kieu di chuyen va tan cong rieng. Nguoi choi co the ra lenh Xung phong hoac Cho lenh cho cac don vi tren cung mot hang, nhung khong the truc tiep dieu khien duong di cua chung.\n\n5. Muc tieu cua don vi Xung tran la pha qua tran dia doi phuong va chung khong rut lui. Khi tat ca don vi da vuot qua tran dia hai ben va roi chien truong, vo tuong co diem cao hon se thang tran doi quyet.\n\n6. Neu hai ben bang diem, ket qua duoc quyet dinh theo sinh; ben co sinh cao hon chien thang.
