String = 13500,Mo ta binh chung
String = 13501,Trong bo binh la binh chung co ban tren chien truong. Rat hieu qua khi doi dau cung binh va no binh tan cong tu xa, nhung lai bi ky binh khac che manh.
String = 13502,Than dao binh la cap nang cao cua Trong bo binh, co ti le chinh xac cao hon. Trong chien dau co co hoi phat dong Dot kich, gay sat thuong toi da hai dich tren mot duong thang phia truoc.
String = 13503,Truong cung binh co the ban cau vong tu khoang cach xa. Do chinh xac hoi thap nhung tam ban rat xa. Neu co binh can chien che chan phia truoc, cung binh co the phat huy toi da suc manh.
String = 13504,Cuong cung binh la cap nang cao cua Truong cung binh, co Toc ban va tam ban cao hon. Co co hoi ban Hoa tien, gay sat thuong gap doi cho ke dich trung ten.
String = 13505,Truong thuong binh co the xem la bo binh trang bi dac biet. Suc chien dau kem bo binh mot chut nhung khac che ky binh rat hieu qua.
String = 13506,Trong kich binh la cap nang cao cua Truong thuong binh, co nang luc co ban tuong duong nhung chinh xac hon. Co co hoi dung Hoanh tao, gay sat thuong toi da ba dich tren mot hang phia truoc.
String = 13507,Cuong no binh cung la binh chung tan cong tam xa, nhung ban thang thay vi ban cau vong. Ten co the xuyen qua mot dich, nhung neu quan ta chan phia truoc thi no binh khong the ban.
String = 13508,Trong no binh la cap nang cao cua Cuong no binh, co Toc ban va tam ban cao hon. Co co hoi ban Thau giap tien, xuyen qua toi da ba dich.
String = 13509,Phu ky binh la binh chung co lon, co Toc di chuyen va suc ben cao. Neu tranh duoc uy hiep tu thuong binh, ky binh co the quet sach chien truong.
String = 13510,Trong ky binh la cap nang cao cua Phu ky binh, di chuyen nhanh hon. Co co hoi dung Xung phong thich, gay sat thuong toi da ba dich tren mot duong thang phia truoc.
String = 13511,Dang giap binh la binh chung dac trung Nam Man. Tuy thuoc bo binh nhung khong yeu truoc ky binh. Khien cua dang giap giup khang cung ten, nhung kem hieu qua truoc no binh co suc xuyen cao.
String = 13512,Trong man giap binh la cap nang cao cua Dang giap binh, co nang luc co ban tuong duong nhung chinh xac hon. Khi bi tan cong co co hoi phat dong Phong thu va khong nhan sat thuong.
String = 13513,Can ve binh la binh chung Toc cao chi sau ky binh. Co the can chien va nem phi dao tam trung. Nhuoc diem la khoang cach giua cac don tan cong dai, nen can giu khoang cach de phat huy suc manh.
String = 13514,Than ve binh la cap nang cao cua Can ve binh, co Toc va tam ban cao hon. Co co hoi phat dong Tam lien dao, gay sat thuong toi da ba dich.
String = 13515,Manh thu binh la ky binh dac hoa, rat manh khi doi dau bo binh. Tuy nhien Toc thap hon cac ky binh khac va rat ngai tan cong tu Can ve binh.
String = 13516,Tuong binh la cap nang cao cua Manh thu binh. Toc giam dang ke nhung phong thu cao hon. Co co hoi dung Trong dap, bo qua phong thu va truc tiep ha dich phia truoc.
String = 13517,Ninja la binh chung dac biet cua Nhat Ban, kha nang gan giong Can ve binh. Co the can chien va tan cong tam trung, tam ban ngan hon nhung di chuyen nhanh hon.
String = 13518,An nhan la cap nang cao cua Ninja, co Toc va tam ban cao hon. Nang luc An than khien dich khong the nam duoc hanh tung cho den khi don vi bi tan cong.
String = 13519,No xa la binh chung hiem co voi tam ban cuc xa. Toc tan cong cham nhung tam ban xa nhat trong cac binh chung tam xa. Neu quan ta chan phia truoc thi khong the ban.
String = 13520,Lien no xa la cap nang cao cua No xa, rut ngan dang ke thoi gian tan cong. Co co hoi ban Xuyen nham tien, xuyen qua toi da nam dich.
String = 13521,Xe nem da la binh chung hiem co, co Toc tan cong cham nhat nhung co the ban cau vong tu xa. Day cung la binh chung tam xa duy nhat co don danh thuong gay sat thuong dien rong.
String = 13522,Phi thach xa la cap nang cao cua Xe nem da, tan cong nhanh hon. Co co hoi ban Viem dan, uy luc lon va tao lua tren mat dat de thieu dot dich lien tuc.
String = 13523,Hoang Can binh gan giong bo binh nhung yeu hon mot chut. Uu diem lon nhat la khac che cac binh chung dac biet nhu Thi binh.
String = 13524,Hoang Can truong la cap nang cao cua Hoang Can binh, co do chinh xac cao hon. Co co hoi dung Huyet nhan de hut sinh dich cho ban than, tang kha nang chien dau lau dai.
String = 13525,Hung No binh la binh chung rieng cua Hung No. Suc chien dau kem ky binh thuong mot chut nhung khang tot cung binh, no binh va man binh, dong thoi Toc cung cao hon ky binh thuong.
String = 13526,Du ky binh la cap nang cao cua Hung No binh, di chuyen nhanh hon. Don Khoai tram hiem khi phat dong nhung co the gay sat thuong toi da bon dich cung luc.
String = 13527,Lang nhan la bo binh dac biet cua Nhat Ban, co suc tan cong cao hon bo binh thuong nhung di chuyen rat cham.
String = 13528,Vo si la cap nang cao cua Lang nhan, co do chinh xac cao hon. Co co hoi dung Nha lam, gay sat thuong toi da ba dich tren mot duong thang phia truoc.
String = 13529,Thi binh la bo binh rat dac biet, co Toc di chuyen cham nhat nhung phong thu cao nhat trong bo binh.
String = 13530,Thi ma la cap nang cao cua Thi binh, Toc co tang. Moi khi giet mot dich co co hoi dung Yeu yem, bien xuong cot dich thanh Thi binh phuc vu quan ta.
String = 13531,Moc nhan la binh chung co quan cuc hiem, di chuyen cham nhung suc ben rat cao va co the tan cong pham vi o khoang cach ngan.
String = 13532,Thiet nhan la cap nang cao cua Moc nhan va co suc ben cao nhat. Co the tan cong pham vi tam trung, uy luc lon; khi chet con co co hoi Tu bao, gay sat thuong toi da muoi dich xung quanh.
String = 13533,Dao xa binh la binh chung dac trung Hung No. Di chuyen, tan cong va toc danh deu cham, nhung phong thu rat cao gan nhu Moc nhan. Se bat loi khi gap ky binh va Moc chuy binh.
String = 13534,Thiet xa binh la cap nang cao cua Dao xa binh, phong thu cao hon va co co hoi dung Xung cham, gay sat thuong toi da sau dich phia truoc.
String = 13535,Kiem binh la binh chung giap nhe linh hoat, Toc di chuyen gan ky binh va toc danh nhanh nhat trong cac binh chung. Nhuoc diem lon nhat la kho chong tan cong tam xa.
String = 13536,Kiem ve la cap nang cao cua Kiem binh, tang toc danh va suc tan cong. Co co hoi dung Kiem mang, gay sat thuong toi da ba dich phia truoc.
String = 13537,Moc chuy binh di chuyen cham nhung suc tan cong gan bang Thiet nhan. Nho trang bi bua go lon, co do chinh xac dac biet cao khi danh tuong thanh va quan cu phong thu thanh.
String = 13538,Thiet chuy binh la cap nang cao cua Moc chuy binh va la binh chung co suc tan cong cao nhat. Co co hoi dung Chan dia, gay sat thuong toi da tam dich xung quanh. Cung rat chinh xac khi danh tuong thanh va quan cu thu thanh.
String = 13539,Lien cau binh la binh chung dac trung Hung No. Toc danh hoi cham hon bo binh nhung di chuyen nhanh. Vu khi lien cau giup no co do chinh xac rat cao khi danh tuong thanh va quan cu thu thanh.
String = 13540,Cang cau binh la cap nang cao cua Lien cau binh, tang nhe toc danh va Toc. Co co hoi dung Dai hoi toan, gay sat thuong toi da tam dich xung quanh.
String = 13541,Thuy binh la binh chung dac biet, nang luc gan bo binh thuong nhung khong co quan he khac che ro ret voi binh chung khac, do chinh xac on dinh.
String = 13542,Lan giap thuy binh la cap nang cao cua Thuy binh. Nang luc co ban khong noi bat, nhung khi chien dau tren mat nuoc se phat dong Thuy chien, tang manh phong thu, tan cong, chinh xac va Toc di chuyen.
