String = 23601,Mang sat sinh cuu dan y chi, cam kiem loan tram tren khong, vo so kiem khi huong bon phuong tam huong quet nhanh, khien quan dich ti khong co the ti.
String = 23602,Ngung tu sat khi tai thu trung kiem, ba dao vo cung hung tan chem ngang, tuong diet vong truoc mat quan dich.
String = 23603,Dau chi dang cao thang hoa la luoi dao khong lo, huong truoc hong nhien bo manh, no uy nhu co the phan thien liet dia.
String = 23604,Cuong bao chien y hoa la hung sat hac khi quet qua xung quanh, quan dich nhat bi anh huong, khong chet cung bi thuong.
String = 23605,Khi quan truong thuong, dung Toc dien quang thach hoa xoay va dam manh, no the uy manh, nhu co the sat quy than.
String = 23606,Hai tay cam thuong xoay nhanh, vung tao hinh rong anh bac, thuan the dam ra, khap nhu Ngan Long Tuong Khong, than uy hien hach.
String = 23607,Hai tay cam thuong tat tuyen, ban ra vo so nhue khi, mot thuong dam ra, ba dao dau khi mui nhon khong the can.
String = 23608,Van Thien Cuong chi luc, dan long khi dia mach xong thang cuu tieu, uy luc dai, co the tri dat nut ba phan.
String = 23609,Thu trung Truong thuong lai hoi cuong vu, quyen dong man thien hoang sa phong nhan, binh dich quyen nhap trong do, ngay lap tuc tan xuong nat thit.
String = 23610,Truong thuong manh huy, kich dan luong khi bao phat, dong thoi tap sat truoc sau luong phuong quan dich.
String = 23611,Luoi sac trong tay vung lien tuc, nhu song sac ben thuy nhan pha khong lao di, quan dich khong kip tranh nguoi, khong chet cung bi thuong.
String = 23612,Dung suc manh van quan dam manh xuong dat, khien vo so luong khi pha dat no tung, tap sat quan dich xung quanh.
String = 23613,Ngung tu hung bao sat khi nguong thien truong tieu, mo ho thay Manh ho hinh.
String = 23614,Khi quan truong thuong, cuc toc manh huy, kich dan loi dinh bich lich uy.
String = 23615,Thu trung luoi sac te phong chem nhanh, khi nhan ngay lap tuc dung nhat hoa thien, ho tieu va khu.
String = 23616,Phien vu choi mat hoa quang, khien chung da binh dich tang that tam tri, phan la quan ta hieu luc.
String = 23617,Thu trung vu khi van chuyen nhu phi, tuyen phong trung kem theo tan phan lac anh, khan nhu mem mai, thuc thi sac liet rat.
String = 23618,Vo tuong cuong bao loan tram, sat khi huyen hoa choi mat tu diep truy kich quan dich, la hoa my va hao hung co ca chieu.
String = 23619,Dang cao hung sat khi hoa la lang anh phi bon va xuat, thon phe truoc mat vo so quan dich.
String = 23620,Ngung tu dau khi chan thien bao hong, thanh the kinh thien dong dia, mo ho thay giai trai hinh.
String = 23621,Vung quat, vo so ta quang mau den vuot tay bay ra, Truy Hon Doat Phach, diet dich den cung.
String = 23622,Hong nhien kich dia, khien thuy mach pha dia no xung, the nhu thao thien lang trieu.
String = 23623,De thang dau khi, huyen hoa xuat bon kim sac quang anh, tap sat tu phuong quan dich.
String = 23624,Hoa khi thanh luoi, bo manh lien tuc, the nhu song du, khien tu phuong quan dich khong noi tranh.
String = 23625,Dung thu trung vu khi trieu thien nhat chi, hoang thien yeu loi ngay lap tuc hong nhien lac ha.
String = 23626,Dung thu trung vu khi manh hong mat dat, gay ra chan dia song xung kich quet sach quan dich.
String = 23627,Tang dau khi, manh nhien nhat phach, khien dia xac kich dang, quan dich kho ton hoat.
String = 23628,Xan lan doat muc hoa le tuyet ky, tu xa that thai anh sang, quan dich nhat xuc, phi tu tuc si.
String = 23629,Khi ngung cung no, manh nhien thoat thu, luu tinh mua ten ngay lap tuc pha khong phi khu.
String = 23630,Thu xuat huyen dieu ky gioi - loi hoa than sung, phao kich truoc mat quan dich.
String = 23631,Phe huyet hung tan y chi hoa la thuc the yeu hinh, thuc hon doat menh, hung ta vo cung.
String = 23632,Vu phien khinh huy, phong ra mien mat hoa vu, khan nhu mem yeu, thuc thi truy tich thuong nhan, khien vo so quan dich hoa la than den.
String = 23633,Thang hoa nhien thieu dau khi, theo vu khi xoay nhanh ban nhanh ra, mo ho thay hinh Hoa Phuong xoe canh.
String = 23634,Sat khi cuong da trong long, ngung la hinh bach thu lao nhanh, dung nanh sac vuot nhon tap sat quan dich.
String = 23635,Ngung tu khi viem nong, hai tay cam thuong xoay nhanh, bay tan khap noi nong ruc luong khi, nhu mua lua tu troi roi xuong.
String = 23636,Loi kiem chem nhanh, bat dao sac ben kiem quang tat phi va xuat, khap nhu oa quoc truyen thuyet ma thu hinh.
String = 23637,Tuong kiem khi hoa la thuc the quang luan phi tan va xuat, nguoi trung don khong chet cung bi thuong
String = 23638,Tuong vo cung kiem khi ngung tu thanh nhat diem phong ra, tren duong di quan dich deu phi mi
String = 23639,Tuong vo cung dao khi ngung tu thanh nhat diem phong ra, tren duong di quan dich deu phi mi
String = 23640,Xung hoang phong de vo cung ba khi gia dung thang hoa, hoa la thuc chat sat khi kich xa va xuat, khong doan gay sat thuong xung quanh binh dich
